# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  OPENSSL_VERSION: "3.5.0"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # ── Install OpenSSL (Linux) ── source build with cache ──
    - name: Cache OpenSSL (Linux)
      if: runner.os == 'Linux'
      id: cache-openssl-linux
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/openssl-install
        key: openssl-${{ env.OPENSSL_VERSION }}-linux-x64

    - name: Build OpenSSL from source (Linux)
      if: runner.os == 'Linux' && steps.cache-openssl-linux.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential
        curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
        tar xzf openssl.tar.gz
        cd "openssl-${OPENSSL_VERSION}"
        ./Configure --prefix="${{ github.workspace }}/openssl-install" --openssldir="${{ github.workspace }}/openssl-install/ssl" no-docs
        make -j$(nproc)
        make install_sw

    # ── Install OpenSSL (macOS) ── Homebrew ──
    - name: Install OpenSSL (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install openssl@3

    # ── Install OpenSSL (Windows) ── vcpkg with cache ──
    - name: Cache vcpkg OpenSSL (Windows)
      if: runner.os == 'Windows'
      id: cache-openssl-windows
      uses: actions/cache@v4
      with:
        path: C:\vcpkg\installed
        key: openssl-vcpkg-windows-x64-${{ env.OPENSSL_VERSION }}

    - name: Install OpenSSL via vcpkg (Windows)
      if: runner.os == 'Windows' && steps.cache-openssl-windows.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        vcpkg install openssl:x64-windows

    # ── Configure CMake ──
    - name: Configure CMake
      shell: bash
      run: |
        cmake_args=(
          -B "${{ steps.strings.outputs.build-output-dir }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DXYLEM_ENABLE_TESTING=ON
          -DXYLEM_ENABLE_TLS=ON
          -S "${{ github.workspace }}"
        )

        if [ "$RUNNER_OS" = "Linux" ]; then
          cmake_args+=(-DOPENSSL_ROOT_DIR="${{ github.workspace }}/openssl-install")
        elif [ "$RUNNER_OS" = "macOS" ]; then
          cmake_args+=(-DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)")
        elif [ "$RUNNER_OS" = "Windows" ]; then
          cmake_args+=(-DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake")
        fi

        cmake "${cmake_args[@]}"

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  # ── Android (NDK cross-compile, arm64 only, build + TLS) ──
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache OpenSSL (Android arm64)
      id: cache-openssl-android
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/openssl-android
        key: openssl-${{ env.OPENSSL_VERSION }}-android-arm64-v8a

    - name: Cross-compile OpenSSL for Android
      if: steps.cache-openssl-android.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
        tar xzf openssl.tar.gz
        cd "openssl-${OPENSSL_VERSION}"

        export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
        export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

        ./Configure android-arm64 \
          -D__ANDROID_API__=29 \
          --prefix="${{ github.workspace }}/openssl-android" \
          --openssldir="${{ github.workspace }}/openssl-android/ssl" \
          no-docs no-tests no-shared
        make -j$(nproc)
        make install_sw

    - name: Configure CMake (Android NDK)
      shell: bash
      run: |
        cmake \
          -B build \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/openssl-android" \
          -DXYLEM_ENABLE_TESTING=ON \
          -DXYLEM_ENABLE_TLS=ON \
          -DOPENSSL_ROOT_DIR="${{ github.workspace }}/openssl-android" \
          -S .

    - name: Build (Android)
      run: cmake --build build --config Release

  # ── iOS (Xcode cross-compile, arm64 only, build + TLS) ──
  build-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache OpenSSL (iOS)
      id: cache-openssl-ios
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/openssl-ios
        key: openssl-${{ env.OPENSSL_VERSION }}-ios-arm64-dt15

    - name: Cross-compile OpenSSL for iOS
      if: steps.cache-openssl-ios.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
        tar xzf openssl.tar.gz
        cd "openssl-${OPENSSL_VERSION}"

        export IPHONEOS_DEPLOYMENT_TARGET=15.0

        ./Configure ios64-xcrun \
          --prefix="${{ github.workspace }}/openssl-ios" \
          --openssldir="${{ github.workspace }}/openssl-ios/ssl" \
          no-docs no-tests no-shared
        make -j$(sysctl -n hw.ncpu)
        make install_sw

    - name: Configure CMake (iOS)
      shell: bash
      run: |
        cmake \
          -B build \
          -G Ninja \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/openssl-ios" \
          -DXYLEM_ENABLE_TESTING=ON \
          -DXYLEM_ENABLE_TLS=ON \
          -DOPENSSL_ROOT_DIR="${{ github.workspace }}/openssl-ios" \
          -S .

    - name: Build (iOS)
      run: cmake --build build

  # ── Android (x86_64 emulator, build + TLS + RUN TESTS) ──
  test-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # KVM is required for hardware-accelerated x86_64 emulation.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Cache OpenSSL (Android x86_64)
      id: cache-openssl-android-x86
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/openssl-android-x86_64
        key: openssl-${{ env.OPENSSL_VERSION }}-android-x86_64

    - name: Cross-compile OpenSSL for Android x86_64
      if: steps.cache-openssl-android-x86.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
        tar xzf openssl.tar.gz
        cd "openssl-${OPENSSL_VERSION}"

        export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
        export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

        ./Configure android-x86_64 \
          -D__ANDROID_API__=29 \
          --prefix="${{ github.workspace }}/openssl-android-x86_64" \
          --openssldir="${{ github.workspace }}/openssl-android-x86_64/ssl" \
          no-docs no-tests no-shared
        make -j$(nproc)
        make install_sw

    - name: Configure CMake (Android x86_64)
      shell: bash
      run: |
        cmake \
          -B build \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=x86_64 \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/openssl-android-x86_64" \
          -DXYLEM_ENABLE_TESTING=ON \
          -DXYLEM_ENABLE_TLS=ON \
          -DOPENSSL_ROOT_DIR="${{ github.workspace }}/openssl-android-x86_64" \
          -S .

    - name: Build (Android x86_64)
      run: cmake --build build --config Release -j

    - name: Run tests on Android emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        arch: x86_64
        target: google_apis
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        disable-animations: true
        script: |
          adb wait-for-device
          adb shell "mkdir -p /data/local/tmp/xylem"
          fail=0
          for bin in build/tests/test-*; do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            name="$(basename "$bin")"
            echo "::group::$name"
            adb push "$bin" /data/local/tmp/xylem/ >/dev/null
            adb shell "cd /data/local/tmp/xylem && chmod 755 ./$name && ./$name; echo __EXIT__:\$?" \
              > run.log 2>&1
            cat run.log
            code="$(grep '__EXIT__:' run.log | tail -1 | sed 's/.*__EXIT__://' | tr -d '\r ')"
            echo "::endgroup::"
            if [ "$code" != "0" ]; then
              echo "FAILED: $name (exit ${code:-?})"
              fail=1
            fi
          done
          exit $fail

  # ── iOS (arm64 simulator, build + TLS + RUN TESTS) ──
  test-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache OpenSSL (iOS simulator)
      id: cache-openssl-ios-sim
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/openssl-ios-sim
        key: openssl-${{ env.OPENSSL_VERSION }}-ios-simulator-arm64

    - name: Cross-compile OpenSSL for iOS simulator (arm64)
      if: steps.cache-openssl-ios-sim.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
        tar xzf openssl.tar.gz
        cd "openssl-${OPENSSL_VERSION}"

        # iossimulator-xcrun builds against the iPhoneSimulator SDK; -arch
        # picks the slice (arm64 to match the Apple-silicon CI runner).
        export IPHONEOS_DEPLOYMENT_TARGET=15.0
        ./Configure iossimulator-xcrun -arch arm64 \
          --prefix="${{ github.workspace }}/openssl-ios-sim" \
          --openssldir="${{ github.workspace }}/openssl-ios-sim/ssl" \
          no-docs no-tests no-shared
        make -j$(sysctl -n hw.ncpu)
        make install_sw

    - name: Configure CMake (iOS simulator)
      shell: bash
      run: |
        cmake \
          -B build \
          -G Ninja \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT=iphonesimulator \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/openssl-ios-sim" \
          -DXYLEM_ENABLE_TESTING=ON \
          -DXYLEM_ENABLE_TLS=ON \
          -DOPENSSL_ROOT_DIR="${{ github.workspace }}/openssl-ios-sim" \
          -S .

    - name: Build (iOS simulator)
      run: cmake --build build

    - name: Boot iOS simulator
      id: sim
      shell: bash
      run: |
        # Pick the newest available iPhone device type + iOS runtime.
        DEVICE_ID="$(xcrun simctl create xylem-ci \
          "$(xcrun simctl list devicetypes -j | python3 -c 'import sys,json; d=[x for x in json.load(sys.stdin)["devicetypes"] if "iPhone" in x["name"]]; print(d[-1]["identifier"])')")"
        xcrun simctl boot "$DEVICE_ID"
        xcrun simctl bootstatus "$DEVICE_ID" -b
        echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

    - name: Run tests on iOS simulator
      shell: bash
      run: |
        fail=0
        for bin in build/tests/test-*; do
          [ -f "$bin" ] && [ -x "$bin" ] || continue
          name="$(basename "$bin")"
          echo "::group::$name"
          if xcrun simctl spawn "${{ steps.sim.outputs.device_id }}" "$PWD/$bin"; then
            echo "ok: $name"
          else
            echo "FAILED: $name (exit $?)"
            fail=1
          fi
          echo "::endgroup::"
        done
        exit $fail

    - name: Shutdown simulator
      if: always()
      run: xcrun simctl shutdown "${{ steps.sim.outputs.device_id }}" || true
